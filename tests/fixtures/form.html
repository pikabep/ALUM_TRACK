<!doctype html>
<html><head><title>Fixture Form</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  #overlay { position: fixed; left: 0; top: 380px; width: 400px; height: 60px; background: rgba(0,0,0,.6); color: #fff; }
  .fake-btn { cursor: pointer; display: inline-block; padding: 6px; border: 1px solid #888; }
  .fake-btn span { cursor: pointer; }
  #far { margin-top: 1600px; }
</style></head>
<body>
  <label for="from">From station</label> <input id="from" type="text" placeholder="From*">
  <input id="pwd" type="password" placeholder="Password">
  <select id="quota"><option value="GN">GENERAL</option><option value="TQ">TATKAL</option></select>
  <label><input id="agree" type="checkbox"> I agree</label>
  <button id="search" onclick="setTimeout(() => document.getElementById('result').textContent = 'Found 3 trains for ' + document.getElementById('from').value + ' / ' + document.getElementById('quota').value, 700)">Search</button>
  <div class="fake-btn" id="fake" onclickless><span>AC Chair Car (CC)</span></div>
  <button id="alert" onclick="alert('Session expired')">Alert me</button>
  <p id="result"></p>
  <div style="position:absolute; top:390px; left:20px"><button id="hidden-behind" onclick="document.title='covered clicked'">Covered</button></div>
  <div id="overlay">Please wait...</div>
  <iframe id="frm" style="position:absolute; top:200px; left:450px; width:300px; height:120px" srcdoc="<button id='inner' onclick='this.textContent=&quot;inner clicked&quot;'>Pay inside frame</button>"></iframe>
  <button id="far">Far below</button>
  <script>document.getElementById('fake').addEventListener('click', () => document.getElementById('result').textContent = 'class CC chosen');</script>
</body></html>
